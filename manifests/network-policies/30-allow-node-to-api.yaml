# Readiness probes and port-forward traffic reach the pod from the node itself,
# which sits outside the pod network. The CIDR below is the Docker network Kind
# runs on; scripts/verify.sh checks the value in use and fails if it drifts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-to-api
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 8080
