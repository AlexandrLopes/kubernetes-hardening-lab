# Compliant except for the missing resource limits: expected to be rejected by
# the Kyverno policy require-resource-limits.
apiVersion: v1
kind: Pod
metadata:
  name: test-no-limits
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: registry.internal:5000/api:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
